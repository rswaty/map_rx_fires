name: Make burn maps

# Runs when a CSV in inputs/ is added or changed. Maps are attached to the run as a zip.
on:
  push:
    paths: ["inputs/*.csv"]
  workflow_dispatch:
    inputs:
      csv:
        description: "CSV to map, e.g. inputs/my_burns.csv"
        required: true

permissions:
  contents: read

jobs:
  maps:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the CSV(s) to map
        run: |
          if [ -n "${{ github.event.inputs.csv }}" ]; then
            echo "${{ github.event.inputs.csv }}" > csvs.txt
          else
            git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'inputs/*.csv' > csvs.txt
          fi
          echo "CSVs to map:"; cat csvs.txt
          test -s csvs.txt || { echo "No new or changed CSV in inputs/"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Make maps (max 5 burns per CSV)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          while read -r f; do
            name=$(basename "$f" .csv)
            python src/run_csv.py "$f" --out "maps/$name" --max-burns 5
            mkdir -p "zip/$name" && cp -r "maps/$name/review/." "zip/$name/"
          done < csvs.txt

      - name: Attach maps to this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-maps
          path: zip/
          retention-days: 90

      - name: Check that every burn produced maps
        run: |
          python - << 'PY'
          import os, sys, pandas as pd
          from pathlib import Path
          summary = Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
          bad = []
          for p in sorted(Path("zip").glob("*/summary.csv")):
              df = pd.read_csv(p).fillna("")
              cols = [c for c in ["key", "burn_date", "reported_acres", "ac_best_effort",
                                  "best_effort_confidence", "status"] if c in df.columns]
              head = "| " + " | ".join(cols) + " |\n| " + " | ".join(["---"] * len(cols)) + " |"
              rows = ["| " + " | ".join(str(r[c]) for c in cols) + " |" for _, r in df.iterrows()]
              with summary.open("a") as f:
                  f.write(f"### {p.parent.name}\n\n" + "\n".join([head, *rows]) + "\n\n")
              for _, r in df[df["status"] != "ok"].iterrows():
                  bad.append(f"{p.parent.name}/{r['key']}: {r['status']}")
          if bad:
              sys.exit("Some burns produced no maps:\n  " + "\n  ".join(bad))
          PY
